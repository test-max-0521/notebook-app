<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notebook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>📒 Notebook</h1>
        <button id="new-note" title="New note">+</button>
      </div>
      <div class="search-box">
        <input type="text" id="search" placeholder="Search notes…">
      </div>
      <ul id="notes-list"></ul>
    </aside>
    <main class="editor">
      <div id="empty-state" class="empty-state">
        <p>Select a note or create a new one</p>
      </div>
      <div id="editor-area" class="editor-area hidden">
        <input type="text" id="note-title" placeholder="Note title">
        <div class="editor-tools">
          <div class="mode-toggle" role="tablist" aria-label="Editor mode">
            <button id="mode-write" class="mode-btn active" data-mode="write" type="button">Write</button>
            <button id="mode-preview" class="mode-btn" data-mode="preview" type="button">Preview</button>
          </div>
          <label class="template-picker">
            <span>Template</span>
            <select id="note-template">
              <option value="">Insert template…</option>
              <option value="meeting">Meeting notes</option>
              <option value="daily">Daily journal</option>
              <option value="tasks">Task list</option>
            </select>
          </label>
        </div>
        <div class="editor-body">
          <textarea id="note-body" placeholder="Start writing… (type / for commands)"></textarea>
          <div id="markdown-preview" class="markdown-preview hidden" aria-live="polite"></div>
          <div id="slash-menu" class="slash-menu hidden"></div>
        </div>
        <div class="editor-footer">
          <span id="note-date"></span>
          <button id="delete-note" class="delete-btn">Delete</button>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
